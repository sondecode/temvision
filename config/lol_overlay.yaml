# Deprecated compatibility config.
# Unified entrypoint now uses `config/lol.yaml` via `python main.py --game=lol`.

game: lol

overlay:
  update_interval: 1.0
  fast_interval: 0.25
  slow_interval: 1.0
  max_suggestions: 5

# Feature flags for data-source layer
data_sources:
  live_api: true
  pre_game: true
  post_game: true
  ocr_fallback: true
  minimap_detector: true

# Live Client API settings
client_api:
  base_url: "https://127.0.0.1:2999"
  timeout: 2.0

# Riot API settings (requires RIOT_API_KEY env var)
riot_api:
  region: "na"
  timeout: 5.0
  match_history_count: 10

# Suggestion engine thresholds
suggestions:
  hp_low_percent: 30.0
  hp_critical_percent: 15.0
  gold_advantage: 500.0
  gold_large_advantage: 1500.0
  level_advantage: 1
  level_large_advantage: 2
  cs_advantage: 20

# Game detection
detection:
  process_names:
    - "league of legends.exe"
    - "leagueclient.exe"

# Pre-game / champ select
pre_game:
  fetch_interval: 5.0
  show_ranks: true

# HUD OCR regions (x, y, w, h) for 1920×1080
hud_regions:
  gold: [870, 880, 120, 30]
  cs: [1060, 880, 60, 25]
  kda: [160, 880, 140, 25]
  level: [30, 830, 30, 25]
  game_time: [930, 0, 60, 25]

# Spell tracker
spell_tracker:
  enabled: true

# Threat scorer
threat_scorer:
  enabled: true
  top_n: 3

# Build recommender / rune importer
build_recommender:
  enabled: true
  auto_import_runes: false

# Match history (SQLite)
match_history:
  enabled: true
  db_path: ""  # Empty = default ~/.temvision/match_history.db
